services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fca
      POSTGRES_PASSWORD: fca        # local development only
      POSTGRES_DB: fca
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fca -d fca"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fca:fca@db:5432/fca
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    profiles: ["app"]

  ui:
    build: .
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fca:fca@db:5432/fca
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8501:8501"
    profiles: ["app"]

volumes:
  pgdata:
