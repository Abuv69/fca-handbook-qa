name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fca
          POSTGRES_PASSWORD: fca
          POSTGRES_DB: fca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fca -d fca"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fca:fca@localhost:5432/fca
      EMBEDDER: hash
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and integration tests
        run: pytest -q
      - name: Demo pipeline and retrieval gate
        run: |
          python -m fcaqa init-db
          python -m fcaqa ingest --sourcebook DEMO --from-file data/demo/demo_v1.json
          python -m fcaqa ingest --sourcebook DEMO --from-file data/demo/demo_v2.json
          python -m fcaqa eval eval/questions.demo.jsonl --sourcebook DEMO --retrieval-only --label demo --min-hit 0.7
