[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fcaqa"
version = "0.1.0"
description = "Question answering over the FCA Handbook with cited rules, change tracking and an evaluation harness"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "fastembed>=0.5",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Postgres with pgvector (set DATABASE_URL)"]
